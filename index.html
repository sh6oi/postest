<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>وضعيات التصوير الشعاعي | ONERAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #f1c40f;
            --gold-bright: #ffd93d;
            --gold-soft: rgba(241, 196, 15, 0.15);
            --gold-glow: rgba(241, 196, 15, 0.45);
            --black: #040406;
            --dark: #0a0a0e;
            --dark-2: #101016;
            --panel: rgba(255, 255, 255, 0.035);
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(241, 196, 15, 0.22);
            --border-soft: rgba(255, 255, 255, 0.08);
            --text: #f6f7f9;
            --muted: #8b919c;
            --radius: 22px;
            --radius-sm: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== خلفية مستقبلية متحركة ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 12% 15%, rgba(241, 196, 15, 0.12), transparent 42%),
                radial-gradient(circle at 88% 85%, rgba(241, 196, 15, 0.09), transparent 42%),
                radial-gradient(circle at 50% 50%, rgba(18, 18, 24, 0.7), var(--black) 82%);
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(241, 196, 15, 0.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(241, 196, 15, 0.028) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 50% 38%, black 8%, transparent 72%);
            -webkit-mask-image: radial-gradient(circle at 50% 38%, black 8%, transparent 72%);
            z-index: -1;
            pointer-events: none;
            animation: gridMove 38s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(64px, 64px); }
        }

        /* ===== حماية الصور ===== */
        .protected-image {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
            user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none;
            pointer-events: none;
        }

        .watermark-container {
            position: relative; display: block; overflow: hidden;
            border-radius: var(--radius-sm); width: 100%; cursor: zoom-in;
            background: #0a0a0f;
        }
        .watermark-container::before {
            content: 'ONERAY ACADEMY';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            color: rgba(255, 255, 255, 0.28);
            font-size: 0.95rem; font-weight: 800; white-space: nowrap;
            z-index: 10; pointer-events: none;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8); letter-spacing: 3px;
        }
        .watermark-container::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(45deg,
                rgba(241, 196, 15, 0.025) 0px, rgba(241, 196, 15, 0.025) 18px,
                transparent 18px, transparent 36px);
            z-index: 5; pointer-events: none;
        }
        .watermark-container img {
            width: 100%; height: 100%; object-fit: cover;
            -webkit-user-drag: none; user-select: none; pointer-events: none;
            display: block; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .watermark-container:hover img { transform: scale(1.07); }

        /* ===== Lightbox ===== */
        .image-lightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.97); z-index: 99999;
            align-items: center; justify-content: center; padding: 20px;
            cursor: zoom-out; backdrop-filter: blur(10px);
        }
        .image-lightbox.show { display: flex; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .image-lightbox-content {
            position: relative; max-width: 92%; max-height: 92%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .image-lightbox img {
            max-width: 100%; max-height: 82vh; object-fit: contain;
            border-radius: var(--radius-sm);
            box-shadow: 0 0 80px rgba(241, 196, 15, 0.28);
            -webkit-user-drag: none; user-select: none; pointer-events: none;
        }
        .image-lightbox-close {
            position: absolute; top: -48px; left: -4px;
            background: var(--gold); color: #000; border: none;
            width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; font-size: 1.15rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; z-index: 10;
        }
        .image-lightbox-close:hover { background: #fff; transform: rotate(90deg); }
        .image-lightbox-caption {
            color: #fff; margin-top: 16px; font-size: 1.05rem;
            font-weight: 600; text-align: center;
        }
        .image-lightbox-watermark {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            color: rgba(255, 255, 255, 0.2);
            font-size: 2.2rem; font-weight: 800; white-space: nowrap;
            pointer-events: none; z-index: 5; letter-spacing: 5px;
        }

        /* ===== الحاوية ===== */
        .main-content { display: block; padding: 22px 16px 48px; min-height: 100vh; }
        .container { max-width: 1120px; margin: 0 auto; }

        /* ===== الشريط العلوي ===== */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; margin-bottom: 22px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid var(--border-soft);
            border-radius: var(--radius); backdrop-filter: blur(18px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        .top-bar::before {
            content: ''; position: absolute; top: 0; right: 0; width: 180px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(241,196,15,0.06));
            pointer-events: none;
        }
        .brand {
            display: flex; align-items: center; gap: 14px;
            font-weight: 800; font-size: 1.08rem; letter-spacing: 0.5px;
        }
        .brand .brand-icon {
            width: 46px; height: 46px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--gold), #b8930a);
            color: #000; font-size: 1.35rem;
            box-shadow: 0 0 24px var(--gold-glow);
            animation: brandPulse 3s ease-in-out infinite;
        }
        @keyframes brandPulse {
            0%,100% { box-shadow: 0 0 24px var(--gold-glow); }
            50% { box-shadow: 0 0 40px rgba(241,196,15,0.7); }
        }
        .brand span { color: var(--muted); font-weight: 600; }
        .brand span b { color: var(--gold); font-weight: 800; }

        /* ===== شريط البحث ===== */
        .search-container {
            display: flex; align-items: center; gap: 14px;
            background: var(--glass); border: 1px solid var(--border-soft);
            border-radius: 16px; padding: 14px 20px; margin-bottom: 26px;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .search-container:focus-within {
            border-color: var(--gold);
            background: rgba(241,196,15,0.05);
            box-shadow: 0 0 0 4px var(--gold-soft);
        }
        .search-container i { color: var(--gold); font-size: 1.15rem; }
        .search-container input {
            flex: 1; border: none; outline: none; background: transparent;
            color: var(--text); font-size: 1rem; font-weight: 500;
        }
        .search-container input::placeholder { color: var(--muted); }

        /* ===== مسرح الروبوت ===== */
        .robot-stage {
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 42px 22px 36px; margin-bottom: 26px;
            background:
                radial-gradient(circle at 50% 12%, rgba(241,196,15,0.14), transparent 55%),
                linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
            border: 1px solid var(--border);
            border-radius: 30px;
            backdrop-filter: blur(18px); overflow: hidden;
            box-shadow: 0 24px 70px rgba(0,0,0,0.5), inset 0 0 80px rgba(241,196,15,0.03);
        }
        .robot-stage::before {
            content: ''; position: absolute; inset: -2px; border-radius: 32px;
            background: conic-gradient(from 0deg, transparent, rgba(241,196,15,0.4), transparent 28%);
            animation: rotateBorder 9s linear infinite; z-index: -1; opacity: 0.45;
        }
        @keyframes rotateBorder { to { transform: rotate(360deg); } }

        .robot-avatar {
            width: 186px; height: 186px; border-radius: 50%;
            background: radial-gradient(circle at 35% 25%, #2c2c34, #08080b 72%);
            border: 3px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 6rem; color: var(--gold);
            position: relative; cursor: pointer;
            animation: robotFloat 4.5s ease-in-out infinite;
            box-shadow:
                0 0 44px var(--gold-glow),
                0 0 100px rgba(241,196,15,0.18),
                inset 0 0 44px rgba(241,196,15,0.09);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            flex-shrink: 0;
        }
        .robot-avatar:hover {
            transform: scale(1.06);
            box-shadow: 0 0 70px var(--gold-glow), 0 0 140px rgba(241,196,15,0.3);
        }
        .robot-avatar.speaking {
            animation: robotSpeak 0.6s ease-in-out infinite alternate;
            box-shadow: 0 0 80px rgba(241,196,15,0.8), 0 0 160px rgba(241,196,15,0.4);
        }
        @keyframes robotSpeak {
            from { transform: scale(1) translateY(0); }
            to { transform: scale(1.07) translateY(-7px); }
        }
        .robot-avatar::before,
        .robot-avatar::after {
            content: ''; position: absolute; border-radius: 50%;
            border: 2px solid rgba(241,196,15,0.3);
            animation: robotRing 3.2s ease-out infinite;
        }
        .robot-avatar::before { inset: -16px; }
        .robot-avatar::after { inset: -34px; animation-delay: 1.3s; border-color: rgba(241,196,15,0.13); }
        @keyframes robotRing {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.18); opacity: 0; }
        }
        @keyframes robotFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .robot-antenna {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 20px; background: var(--gold); border-radius: 4px;
        }
        .robot-antenna::after {
            content: ''; position: absolute; top: -11px; left: 50%;
            transform: translateX(-50%); width: 13px; height: 13px;
            background: var(--gold-bright); border-radius: 50%;
            box-shadow: 0 0 14px var(--gold);
            animation: antennaBlink 1.5s ease-in-out infinite;
        }
        @keyframes antennaBlink {
            0%,100% { opacity: 1; box-shadow: 0 0 16px var(--gold); }
            50% { opacity: 0.35; box-shadow: 0 0 4px var(--gold); }
        }

        .robot-bubble {
            margin-top: 30px; max-width: 660px; text-align: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025));
            border: 1px solid var(--border);
            border-radius: 24px; padding: 22px 28px;
            font-weight: 600; font-size: 1.08rem; line-height: 1.85;
            color: var(--text); position: relative;
            box-shadow: 0 14px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            animation: bubbleIn 0.5s ease;
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .robot-bubble strong { color: var(--gold); }
        .robot-bubble .robot-hint {
            display: block; margin-top: 12px; font-size: 0.85rem;
            color: var(--muted); font-weight: 400;
        }
        .robot-cursor {
            display: inline-block; width: 2px; height: 1.1em;
            background: var(--gold); margin-right: 4px;
            vertical-align: text-bottom; animation: blink 0.9s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ===== شبكة المناطق ===== */
        .robot-regions {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
            gap: 14px; width: 100%; max-width: 960px; margin-top: 30px;
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .robot-region-card {
            background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
            border: 1px solid var(--border-soft);
            border-radius: 18px; padding: 20px 12px; text-align: center;
            cursor: pointer; transition: all 0.28s cubic-bezier(0.2,0.8,0.2,1);
            position: relative; overflow: hidden;
        }
        .robot-region-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent, rgba(241,196,15,0.1));
            opacity: 0; transition: opacity 0.28s;
        }
        .robot-region-card:hover {
            border-color: var(--gold);
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 16px 36px rgba(241,196,15,0.2);
        }
        .robot-region-card:hover::before { opacity: 1; }
        .robot-region-card .rr-icon {
            display: block; font-size: 2.1rem; margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(241,196,15,0.45));
            transition: transform 0.28s;
        }
        .robot-region-card:hover .rr-icon { transform: scale(1.15); }
        .robot-region-card .rr-name {
            font-weight: 700; font-size: 0.86rem; color: var(--text);
            display: block; line-height: 1.3; letter-spacing: 0.3px;
        }
        .robot-region-card .rr-badge {
            display: inline-block; margin-top: 10px;
            background: var(--gold-soft); color: var(--gold);
            font-size: 0.72rem; font-weight: 700; padding: 4px 13px;
            border-radius: 12px; border: 1px solid var(--border);
        }
        .robot-region-card.selected {
            background: linear-gradient(135deg, rgba(241,196,15,0.2), rgba(241,196,15,0.05));
            border-color: var(--gold);
            box-shadow: 0 0 0 2px var(--gold-soft), 0 0 34px rgba(241,196,15,0.28);
        }

        .robot-back-btn {
            background: transparent; color: var(--gold);
            border: 2px solid var(--gold); padding: 12px 26px;
            border-radius: 30px; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; margin-top: 26px; display: inline-flex;
            align-items: center; gap: 8px; transition: all 0.28s;
        }
        .robot-back-btn:hover {
            background: var(--gold); color: #000;
            box-shadow: 0 0 30px var(--gold-glow);
            transform: translateY(-2px);
        }

        /* ===== قائمة الوضعيات (بطاقات احترافية) ===== */
        .position-list {
            background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012));
            border: 1px solid var(--border);
            border-radius: 26px; padding: 26px; margin-bottom: 30px;
            display: none; backdrop-filter: blur(16px);
            box-shadow: 0 18px 60px rgba(0,0,0,0.45);
            animation: fadeUp 0.4s ease;
        }
        .position-list-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 22px;
            flex-wrap: wrap; gap: 12px;
        }
        .position-list-header h2 {
            color: var(--text); font-size: 1.35rem;
            display: flex; align-items: center; gap: 12px;
        }
        .position-list-header h2 i { color: var(--gold); }
        .position-list-header .count {
            background: linear-gradient(135deg, var(--gold), #d4a90a);
            padding: 6px 16px; border-radius: 20px;
            font-size: 0.82rem; color: #000; font-weight: 800;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* بطاقات الوضعيات في شبكة احترافية */
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .position-card {
            background: linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.32s cubic-bezier(0.2,0.8,0.2,1);
            position: relative;
            display: flex; flex-direction: column;
        }
        .position-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px);
            box-shadow: 0 22px 50px rgba(241,196,15,0.18), 0 0 0 1px var(--gold-soft);
        }
        .position-card .pc-thumb {
            position: relative; height: 170px; overflow: hidden;
            background: #08080c;
        }
        .position-card .pc-thumb .watermark-container { height: 100%; border-radius: 0; }
        .position-card .pc-thumb img { height: 100%; }
        .position-card .pc-overlay {
            position: absolute; inset: 0; z-index: 6;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.85));
            pointer-events: none;
        }
        .position-card .pc-index {
            position: absolute; top: 12px; right: 12px; z-index: 7;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            color: var(--gold); font-weight: 800; font-size: 0.8rem;
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border);
        }
        .position-card .pc-body {
            padding: 16px 18px 18px;
            display: flex; flex-direction: column; gap: 12px; flex: 1;
        }
        .position-card .pc-title {
            font-weight: 800; font-size: 1rem; color: var(--text);
            line-height: 1.4;
        }
        .position-card .pc-meta {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto;
        }
        .position-card .pc-chip {
            background: var(--glass); border: 1px solid var(--border-soft);
            border-radius: 10px; padding: 5px 10px;
            font-size: 0.72rem; font-weight: 700; color: var(--muted);
            display: inline-flex; align-items: center; gap: 5px;
        }
        .position-card .pc-chip i { color: var(--gold); font-size: 0.72rem; }
        .position-card .pc-chip b { color: var(--text); font-weight: 800; }
        .position-card .pc-action {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 12px; border-top: 1px solid var(--border-soft);
            font-size: 0.82rem; font-weight: 700; color: var(--gold);
        }
        .position-card .pc-action i { transition: transform 0.3s; }
        .position-card:hover .pc-action i { transform: translateX(-5px); }

        .no-data {
            text-align: center; color: var(--muted); padding: 30px;
            font-size: 0.95rem; grid-column: 1 / -1;
        }

        /* ===== صندوق التفاصيل ===== */
        .detail-box {
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
            border: 1px solid var(--border);
            border-radius: 26px; padding: 30px; display: none;
            margin-bottom: 30px; backdrop-filter: blur(16px);
            box-shadow: 0 24px 70px rgba(0,0,0,0.5);
            animation: fadeUp 0.4s ease;
        }
        .detail-header {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 24px; padding-bottom: 18px;
            border-bottom: 2px solid var(--gold);
            flex-wrap: wrap;
        }
        .detail-header h3 { color: var(--text); font-size: 1.5rem; flex: 1; }
        .detail-header .badge {
            background: linear-gradient(135deg, var(--gold), #d4a90a);
            color: #000; padding: 6px 20px;
            border-radius: 20px; font-size: 0.78rem; font-weight: 800;
            box-shadow: 0 0 18px var(--gold-glow);
        }
        .detail-images { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 22px 0; }
        .detail-images figure {
            background: var(--glass); border: 1px solid var(--border-soft);
            border-radius: 20px; padding: 12px; text-align: center;
            transition: border-color 0.28s, transform 0.28s;
        }
        .detail-images figure:hover { border-color: var(--border); transform: translateY(-3px); }
        .detail-images .watermark-container { height: 220px; }
        .detail-images figcaption {
            margin-top: 12px; font-weight: 600; color: var(--muted); font-size: 0.88rem;
        }
        .detail-info {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px; margin: 24px 0;
        }
        .detail-info div {
            background: linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
            padding: 20px 14px; border-radius: 18px;
            text-align: center; border: 1px solid var(--border-soft);
            border-bottom: 3px solid var(--gold);
            transition: transform 0.28s, box-shadow 0.28s;
        }
        .detail-info div:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(241,196,15,0.15);
        }
        .detail-info strong {
            display: block; font-size: 0.78rem; color: var(--muted);
            margin-bottom: 8px; letter-spacing: 1px;
        }
        .detail-info span {
            font-size: 1.35rem; font-weight: 800; color: var(--gold);
            text-shadow: 0 0 16px rgba(241,196,15,0.4);
        }
        .detail-purpose {
            background: rgba(241,196,15,0.06); padding: 24px;
            border-radius: 18px; border-right: 4px solid var(--gold); margin-top: 18px;
        }
        .detail-purpose h4 {
            color: var(--gold); margin-bottom: 12px; font-size: 1rem;
            display: flex; align-items: center; gap: 10px;
        }

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDnNv3tekrHervtMjYk2nv0vluN83dTOrw",
        authDomain: "xraystop-d13d3.firebaseapp.com",
        databaseURL: "https://xraystop-d13d3-default-rtdb.firebaseio.com",
        projectId: "xraystop-d13d3",
        storageBucket: "xraystop-d13d3.firebasestorage.app",
        messagingSenderId: "597257727564",
        appId: "1:597257727564:web:198421df2f0b5206b04ee9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const R2_WORKER_URL = 'https://frosty-field-ea93.mojtabakareem77.workers.dev';

    function getR2Url(imagePath) {
        if (!imagePath) return '';
        if (imagePath.includes('res.cloudinary.com')) {
            const parts = imagePath.split('/');
            const filename = parts[parts.length - 1];
            const folderIndex = imagePath.indexOf('upload/');
            if (folderIndex !== -1) {
                const afterUpload = imagePath.substring(folderIndex + 7);
                const pathParts = afterUpload.split('/');
                if (pathParts.length > 1) {
                    pathParts.pop();
                    const folder = pathParts.join('/');
                    return `${R2_WORKER_URL}/${folder}/${filename}`;
                }
            }
            return `${R2_WORKER_URL}/${filename}`;
        }
        if (imagePath.includes('frosty-field-ea93')) return imagePath;
        return `${R2_WORKER_URL}/${imagePath}`;
    }

    document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG') { e.preventDefault(); return false; }
    });
    document.addEventListener('dragstart', function(e) {
        if (e.target.tagName === 'IMG') { e.preventDefault(); return false; }
    });

    window.openImageLightbox = function(imageSrc, caption) {
        const lightbox = document.getElementById('imageLightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCaption = document.getElementById('lightboxCaption');
        lightboxImage.src = imageSrc;
        lightboxCaption.textContent = caption || '';
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
    };

    window.closeImageLightbox = function() {
        document.getElementById('imageLightbox').classList.remove('show');
        document.body.style.overflow = 'auto';
    };

    document.getElementById('imageLightbox').addEventListener('click', function(e) {
        if (e.target === this) closeImageLightbox();
    });
    document.getElementById('imageLightboxClose').addEventListener('click', closeImageLightbox);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeImageLightbox();
    });

    const regions = [
        { name: "SKULL", icon: "🧠" },
        { name: "MANDIBLE", icon: "🦷" },
        { name: "CERVICAL SPINE", icon: "🦴" },
        { name: "SHOULDER", icon: "💪" },
        { name: "HUMERUS", icon: "🦴" },
        { name: "ELBOW", icon: "💪" },
        { name: "FOREARM", icon: "🖐️" },
        { name: "WRIST", icon: "✋" },
        { name: "HAND", icon: "🤚" },
        { name: "CHEST", icon: "🫁" },
        { name: "THORACIC VERTEBRAE", icon: "🦴" },
        { name: "ABDOMEN", icon: "🩺" },
        { name: "LUMBOSACRAL SPINE", icon: "🦴" },
        { name: "PELVIS", icon: "🦴" },
        { name: "SACRUM COCCYX", icon: "🦴" },
        { name: "FEMUR", icon: "🦵" },
        { name: "KNEE", icon: "🦵" },
        { name: "PATELLA", icon: "🦵" },
        { name: "LEG", icon: "🦵" },
        { name: "ANKLE", icon: "🦶" },
        { name: "FOOT", icon: "🦶" }
    ];

    let allData = {};
    let selectedRegion = null;
    let currentUser = null;
    let userQuizProgress = {};
    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let correctCount = 0;
    let answered = false;
    let robotOpened = false;
    let typingTimer = null;

    /* ===== النطق الصوتي ===== */
    let arabicVoice = null;

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        arabicVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar')) || null;
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakArabic(text) {
        if (!('speechSynthesis' in window)) return;
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;
            utterance.volume = 1;
            if (arabicVoice) utterance.voice = arabicVoice;

            const avatar = document.getElementById('robotAvatar');
            utterance.onstart = () => { if (avatar) avatar.classList.add('speaking'); };
            utterance.onend = () => { if (avatar) avatar.classList.remove('speaking'); };
            utterance.onerror = () => { if (avatar) avatar.classList.remove('speaking'); };

            window.speechSynthesis.speak(utterance);
        } catch (e) {
            console.warn('Speech synthesis error:', e);
        }
    }

    /* ===== كتابة نص الروبوت بشكل مطبعي ===== */
    function typeRobotMessage(html, hint) {
        const msgEl = document.getElementById('robotMessage');
        const hintEl = document.getElementById('robotHint');
        if (!msgEl) return;

        if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        const fullText = tempDiv.textContent || '';

        msgEl.innerHTML = '<span class="robot-cursor"></span>';
        if (hintEl) hintEl.innerHTML = '';

        let i = 0;
        typingTimer = setInterval(() => {
            i++;
            const partial = fullText.substring(0, i);
            msgEl.innerHTML = partial + '<span class="robot-cursor"></span>';
            if (i >= fullText.length) {
                clearInterval(typingTimer);
                typingTimer = null;
                msgEl.innerHTML = html;
                if (hintEl && hint !== undefined) hintEl.innerHTML = hint;
            }
        }, 22);
    }

    function getRegionCount(regionName) {
        return (allData[regionName] || []).length;
    }

    function renderRobotRegions() {
        const container = document.getElementById('robotRegions');
        if (!container) return;
        container.innerHTML = '';

        regions.forEach(region => {
            const count = getRegionCount(region.name);
            const card = document.createElement('div');
            card.className = 'robot-region-card' + (selectedRegion === region.name ? ' selected' : '');
            card.dataset.region = region.name;
            card.innerHTML = `
                <span class="rr-icon">${region.icon}</span>
                <span class="rr-name">${region.name}</span>
                <span class="rr-badge">${count} وضعية</span>
            `;
            card.onclick = () => selectRegionFromRobot(region.name, card);
            container.appendChild(card);
        });
    }

    /* ===== فتح الروبوت ===== */
    function openRobot() {
        robotOpened = true;
        const regionsEl = document.getElementById('robotRegions');
        const backContainer = document.getElementById('robotBackContainer');

        document.getElementById('positionList').style.display = 'none';
        document.getElementById('detailBox').style.display = 'none';
        selectedRegion = null;
        if (backContainer) backContainer.innerHTML = '';

        renderRobotRegions();
        regionsEl.style.display = 'grid';
        regionsEl.style.animation = 'none';
        void regionsEl.offsetWidth;
        regionsEl.style.animation = 'fadeUp 0.5s ease';

        const welcomeHtml = 'أهلاً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>ما المنطقة التي تريد أن تشاهد وضعيات التصوير الشعاعي الخاصة بها؟';
        typeRobotMessage(welcomeHtml, '💡 اختر إحدى المناطق بالأسفل');

        speakArabic('أَهْلًا بِكَ! أَنَا مُسَاعِدُكَ الشُّعَاعِي. مَا الْمِنْطَقَةُ الَّتِي تُرِيدُ أَنْ تُشَاهِدَ وَضْعِيَّاتِ التَّصْوِيرِ الشُّعَاعِيِّ الْخَاصَّةَ بِهَا؟');
    }

    function selectRegionFromRobot(regionName, cardElement) {
        document.querySelectorAll('.robot-region-card').forEach(c => c.classList.remove('selected'));
        if (cardElement) cardElement.classList.add('selected');

        const count = getRegionCount(regionName);
        typeRobotMessage(
            `ممتاز! اخترت <strong>${regionName}</strong> 🎯<br>عدد الوضعيات المتاحة: <strong>${count}</strong>`,
            '💡 اضغط على أي وضعية بالأسفل لعرض تفاصيلها'
        );

        const backContainer = document.getElementById('robotBackContainer');
        if (backContainer) {
            backContainer.innerHTML = '';
            const backBtn = document.createElement('button');
            backBtn.className = 'robot-back-btn';
            backBtn.innerHTML = '<i class="fas fa-arrow-right"></i> تغيير المنطقة';
            backBtn.onclick = () => resetRobotSelection();
            backContainer.appendChild(backBtn);
        }

        selectedRegion = regionName;
        document.getElementById('detailBox').style.display = 'none';

        const positionList = document.getElementById('positionList');
        positionList.style.display = 'block';
        document.getElementById('regionTitle').textContent = `وضعيات ${regionName}`;
        const positions = allData[regionName] || [];
        document.getElementById('positionCount').textContent = positions.length;

        const positionsContainer = document.getElementById('positionsContainer');
        positionsContainer.innerHTML = '';
        if (positions.length === 0) {
            positionsContainer.innerHTML = '<p class="no-data">لا توجد وضعيات متاحة لهذه المنطقة حالياً.</p>';
        } else {
            positions.forEach((pos, index) => {
                const card = document.createElement('div');
                card.className = 'position-card';
                const thumb = getR2Url(pos.realImg || pos.xrayImg);
                const fallback = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23101016%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2216%22%3Eلا توجد صورة%3C/text%3E%3C/svg%3E';
                card.innerHTML = `
                    <div class="pc-thumb">
                        <div class="pc-index">${index + 1}</div>
                        <div class="watermark-container">
                            <img src="${thumb}" alt="${pos.name || ''}" class="protected-image" onerror="this.src='${fallback}'">
                        </div>
                        <div class="pc-overlay"></div>
                    </div>
                    <div class="pc-body">
                        <div class="pc-title">${pos.name || 'وضعية ' + (index + 1)}</div>
                        <div class="pc-meta">
                            <span class="pc-chip"><i class="fas fa-bolt"></i> <b>${pos.kvp || '—'}</b> KVP</span>
                            <span class="pc-chip"><i class="fas fa-fire"></i> <b>${pos.mas || '—'}</b> MAS</span>
                        </div>
                        <div class="pc-action">
                            <span>عرض التفاصيل</span>
                            <i class="fas fa-arrow-left"></i>
                        </div>
                    </div>
                `;
                card.onclick = () => showDetail(pos, card);
                positionsContainer.appendChild(card);
            });
        }

        positionList.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetRobotSelection() {
        selectedRegion = null;
        document.querySelectorAll('.robot-region-card').forEach(c => c.classList.remove('selected'));
        const backContainer = document.getElementById('robotBackContainer');
        if (backContainer) backContainer.innerHTML = '';
        document.getElementById('positionList').style.display = 'none';
        document.getElementById('detailBox').style.display = 'none';
        renderRobotRegions();
        typeRobotMessage(
            'ما المنطقة التي تريد أن تشاهد وضعيات التصوير الشعاعي الخاصة بها؟',
            '💡 اختر إحدى المناطق بالأسفل'
        );
    }

    window.selectRegionFromRobot = selectRegionFromRobot;
    window.resetRobotSelection = resetRobotSelection;

    /* ===== عرض التفاصيل ===== */
    function showDetail(pos, cardEl) {
        document.querySelectorAll('.position-card').forEach(c => c.classList.remove('active'));
        if (cardEl) cardEl.classList.add('active');

        document.getElementById('detailBox').style.display = 'block';
        document.getElementById('detailTitle').textContent = pos.name || '';
        document.getElementById('detailBadge').textContent = pos.region || '';

        const realImgUrl = getR2Url(pos.realImg);
        const xrayImgUrl = getR2Url(pos.xrayImg);
        const fallback = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23101016%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2216%22%3Eلا توجد صورة%3C/text%3E%3C/svg%3E';

        document.getElementById('detailImages').innerHTML = `
            <figure>
                <div class="watermark-container" onclick="openImageLightbox('${realImgUrl}', 'صورة حقيقية - ${(pos.name || '').replace(/'/g, "\\'")}')">
                    <img src="${realImgUrl}" alt="صورة حقيقية" class="protected-image" onerror="this.src='${fallback}'">
                </div>
                <figcaption>صورة حقيقية (اضغط للتكبير)</figcaption>
            </figure>
            <figure>
                <div class="watermark-container" onclick="openImageLightbox('${xrayImgUrl}', 'صورة شعاعية - ${(pos.name || '').replace(/'/g, "\\'")}')">
                    <img src="${xrayImgUrl}" alt="صورة شعاعية" class="protected-image" onerror="this.src='${fallback}'">
                </div>
                <figcaption>صورة شعاعية (اضغط للتكبير)</figcaption>
            </figure>
        `;

        document.getElementById('detailInfo').innerHTML = `
            <div><strong>KVP</strong><span>${pos.kvp || '—'}</span></div>
            <div><strong>MAS</strong><span>${pos.mas || '—'}</span></div>
            <div><strong>سنتر</strong><span>${pos.center || '—'}</span></div>
        `;
        document.getElementById('detailPurpose').innerHTML = `<h4><i class="fas fa-bullseye"></i> الغرض</h4><p>${pos.purpose || '—'}</p>`;

        document.getElementById('detailBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ===== الاختبار ===== */
    function updateQuizRegionSelect() {
        const select = document.getElementById('quizRegionSelect');
        if (!select) return;
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- اختر المنطقة --</option>';
        Object.keys(allData).filter(reg => allData[reg] && allData[reg].length > 0).forEach(reg => {
            const option = document.createElement('option');
            option.value = reg;
            option.textContent = reg;
            select.appendChild(option);
        });
        if (currentVal && allData[currentVal]) select.value = currentVal;
    }

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startQuiz(region) {
        const positions = allData[region] || [];
        if (positions.length < 1) return;

        const allPositionNames = [];
        Object.keys(allData).forEach(reg => {
            allData[reg].forEach(pos => { if (pos.name) allPositionNames.push(pos.name); });
        });

        const allQuestions = [];
        positions.forEach(pos => {
            if (pos.realImg) {
                const wrongChoices = shuffleArray(allPositionNames.filter(name => name !== pos.name)).slice(0, 3);
                allQuestions.push({
                    imageSrc: getR2Url(pos.realImg),
                    correctAnswer: pos.name,
                    choices: shuffleArray([pos.name, ...wrongChoices]),
                    questionId: pos.id + '_real'
                });
            }
            if (pos.xrayImg) {
                const wrongChoices = shuffleArray(allPositionNames.filter(name => name !== pos.name)).slice(0, 3);
                allQuestions.push({
                    imageSrc: getR2Url(pos.xrayImg),
                    correctAnswer: pos.name,
                    choices: shuffleArray([pos.name, ...wrongChoices]),
                    questionId: pos.id + '_xray'
                });
            }
        });

        quizQuestions = shuffleArray(allQuestions);
        currentQuestionIndex = 0;
        correctCount = 0;
        answered = false;
        document.getElementById('quizScore').textContent = `0 / ${quizQuestions.length}`;
        renderQuestion();
    }

    function renderQuestion() {
        const content = document.getElementById('quizContent');
        if (!content) return;

        if (currentQuestionIndex >= quizQuestions.length) {
            content.innerHTML = `
                <div style="text-align:center; padding: 30px;">
                    <i class="fas fa-trophy" style="font-size: 4rem; color: var(--gold);"></i>
                    <h3 style="margin:14px 0; color:#fff;">انتهى الاختبار!</h3>
                    <p style="color: var(--muted);">نتيجتك: ${correctCount} من ${quizQuestions.length}</p>
                    <button class="quiz-next-btn" onclick="restartQuiz()">إعادة</button>
                </div>`;
            return;
        }

        const q = quizQuestions[currentQuestionIndex];
        answered = false;

        let html = `
            <div class="quiz-question-area">
                <p style="color: var(--muted); margin-bottom:16px;">السؤال ${currentQuestionIndex + 1} من ${quizQuestions.length}</p>
                <div class="quiz-image-container">
                    <div class="watermark-container" onclick="openImageLightbox('${q.imageSrc}', 'سؤال ${currentQuestionIndex + 1}')">
                        <img src="${q.imageSrc}" alt="وضعية" class="protected-image">
                    </div>
                    <p style="margin-top: 8px; font-size: 0.85rem; color: var(--muted);">اضغط على الصورة للتكبير</p>
                </div>
                <div class="quiz-choices">`;

        q.choices.forEach(choice => {
            html += `<button class="quiz-choice-btn" data-choice="${choice}">${choice}</button>`;
        });

        html += `</div><div class="quiz-feedback" id="quizFeedback"></div></div>`;
        content.innerHTML = html;

        document.querySelectorAll('.quiz-choice-btn').forEach(btn => {
            btn.onclick = function() {
                if (answered) return;
                answered = true;
                const selected = this.dataset.choice;
                const correct = q.correctAnswer;

                document.querySelectorAll('.quiz-choice-btn').forEach(b => b.disabled = true);

                const questionId = q.questionId;
                const isAlreadyAnswered = userQuizProgress[questionId] !== undefined;

                let pointsDelta = 0;
                let message = '';

                if (selected === correct) {
                    this.classList.add('correct');
                    correctCount++;
                    if (!isAlreadyAnswered) {
                        pointsDelta = 1;
                        message = '<span style="color:#27ae60;">✅ صحيح! +1 نقطة</span>';
                    } else {
                        message = '<span style="color:#27ae60;">✅ صحيح! (تم احتساب النقاط مسبقًا)</span>';
                    }
                } else {
                    this.classList.add('wrong');
                    document.querySelectorAll('.quiz-choice-btn').forEach(b => {
                        if (b.dataset.choice === correct) b.classList.add('correct');
                    });
                    if (!isAlreadyAnswered) {
                        pointsDelta = -1;
                        message = `<span style="color:#e74c3c;">❌ خطأ. الصحيح: ${correct} -1 نقطة</span>`;
                    } else {
                        message = `<span style="color:#e74c3c;">❌ خطأ. الصحيح: ${correct} (تم احتساب النقاط مسبقًا)</span>`;
                    }
                }

                document.getElementById('quizFeedback').innerHTML = message;

                if (currentUser && !isAlreadyAnswered) {
                    const userRef = ref(db, 'users/' + currentUser.uid);
                    get(userRef).then((snapshot) => {
                        const currentPoints = snapshot.exists() ? (snapshot.val().points || 0) : 0;
                        const newPoints = currentPoints + pointsDelta;
                        update(userRef, {
                            points: newPoints,
                            [`quizProgress/${questionId}`]: pointsDelta
                        }).then(() => {
                            userQuizProgress[questionId] = pointsDelta;
                        }).catch(error => console.error('Error updating points:', error));

                        update(ref(db, 'leaderboard/' + currentUser.uid), { points: newPoints })
                            .catch(error => console.error('Error updating leaderboard:', error));
                    }).catch(error => console.error('Error fetching user data:', error));
                }

                document.getElementById('quizScore').textContent = `${correctCount} / ${quizQuestions.length}`;

                const nextBtn = document.createElement('button');
                nextBtn.className = 'quiz-next-btn';
                nextBtn.innerHTML = 'التالي <i class="fas fa-arrow-left"></i>';
                nextBtn.onclick = () => { currentQuestionIndex++; renderQuestion(); };
                document.getElementById('quizFeedback').appendChild(document.createElement('br'));
                document.getElementById('quizFeedback').appendChild(nextBtn);
            };
        });
    }

    window.restartQuiz = function() {
        const region = document.getElementById('quizRegionSelect').value;
        if (region) startQuiz(region);
    };

    /* ===== البحث ===== */
    document.getElementById('searchInput').oninput = function(e) {
        const query = e.target.value.toLowerCase().trim();
        const regionsEl = document.getElementById('robotRegions');
        if (query && regionsEl.style.display === 'none') {
            openRobot();
        }
        document.querySelectorAll('.robot-region-card').forEach(card => {
            const name = (card.dataset.region || '').toLowerCase();
            card.style.display = name.includes(query) ? 'block' : 'none';
        });
    };

    document.getElementById('startQuizBtn').onclick = function() {
        const section = document.getElementById('quizSection');
        section.classList.toggle('show');
        if (section.classList.contains('show')) {
            updateQuizRegionSelect();
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    };

    document.getElementById('quizRegionSelect').onchange = function() {
        if (this.value) startQuiz(this.value);
    };

    document.getElementById('robotAvatar').addEventListener('click', function() {
        openRobot();
    });

    /* ===== مراقبة المستخدم ===== */
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
            onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    userQuizProgress = data.quizProgress || {};
                }
            });
        } else {
            userQuizProgress = {};
        }
    });

    /* ===== تحميل البيانات ===== */
    onValue(ref(db, 'positions'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
            allData = {};
            Object.keys(data).forEach(key => {
                const item = data[key];
                const region = item.region || 'OTHER';
                if (!allData[region]) allData[region] = [];
                allData[region].push({ id: key, ...item });
            });
        }
        renderRobotRegions();
        updateQuizRegionSelect();
        if (!robotOpened) {
            typeRobotMessage(
                'مرحباً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>اضغط عليّ لبدء اختيار المنطقة.',
                '💡 أو استخدم مربع البحث بالأعلى'
            );
        }
    }, (error) => {
        console.error('Error loading positions:', error);
        renderRobotRegions();
        if (!robotOpened) {
            typeRobotMessage(
                'مرحباً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>اضغط عليّ لبدء اختيار المنطقة.',
                '💡 أو استخدم مربع البحث بالأعلى'
            );
        }
    });

    /* ===== التهيئة الأولية ===== */
    renderRobotRegions();
    typeRobotMessage(
        'مرحباً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>اضغط عليّ لبدء اختيار المنطقة.',
        '💡 أو استخدم مربع البحث بالأعلى'
    );
    document.body.style.overflow = 'auto';

    /* ===== مفتاح تشغيل/إيقاف الصوت عند الضغط المطول (اختياري) ===== */
    let audioEnabled = true;
    const robotAvatarEl = document.getElementById('robotAvatar');
    if (robotAvatarEl) {
        robotAvatarEl.addEventListener('dblclick', function() {
            audioEnabled = !audioEnabled;
            if (!audioEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            typeRobotMessage(
                audioEnabled ? 'تم <strong>تشغيل</strong> الصوت 🔊' : 'تم <strong>إيقاف</strong> الصوت 🔇',
                '💡 انقر مرتين على الروبوت للتبديل'
            );
        });
    }

    /* ===== تعزيز تجربة اللمس على الجوال ===== */
    document.querySelectorAll('.watermark-container').forEach(el => {
        el.addEventListener('touchstart', function() {}, { passive: true });
    });

</script>
