<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>وضعيات التصوير الشعاعي | ONERAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #f1c40f;
            --gold-soft: rgba(241, 196, 15, 0.15);
            --black: #050505;
            --dark: #0d0d0f;
            --panel: rgba(255, 255, 255, 0.04);
            --glass: rgba(255, 255, 255, 0.07);
            --border: rgba(241, 196, 15, 0.25);
            --text: #f5f5f5;
            --muted: #9aa0a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== خلفية مستقبلية ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(241, 196, 15, 0.10), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(241, 196, 15, 0.07), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(20, 20, 25, 0.6), var(--black) 80%);
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(241, 196, 15, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(241, 196, 15, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at 50% 40%, black 10%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, black 10%, transparent 75%);
            z-index: -1;
            pointer-events: none;
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .protected-image {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
            user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none;
            pointer-events: none; position: relative;
        }

        .watermark-container {
            position: relative; display: inline-block; overflow: hidden;
            border-radius: 14px; width: 100%; cursor: zoom-in; pointer-events: auto;
        }
        .watermark-container::before {
            content: 'ONERAY ACADEMY';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            color: rgba(255, 255, 255, 0.35);
            font-size: 1.1rem; font-weight: 800; white-space: nowrap;
            z-index: 10; pointer-events: none;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7); letter-spacing: 3px;
        }
        .watermark-container::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(45deg,
                rgba(241, 196, 15, 0.03) 0px, rgba(241, 196, 15, 0.03) 20px,
                transparent 20px, transparent 40px);
            z-index: 5; pointer-events: none;
        }
        .watermark-container img {
            width: 100%; height: 200px; object-fit: cover; border-radius: 14px;
            -webkit-user-drag: none; user-select: none; pointer-events: none;
            display: block; transition: transform 0.4s ease;
        }
        .watermark-container:hover img { transform: scale(1.06); }

        /* ===== Lightbox ===== */
        .image-lightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.96); z-index: 99999;
            align-items: center; justify-content: center; padding: 20px;
            cursor: zoom-out; backdrop-filter: blur(8px);
        }
        .image-lightbox.show { display: flex; }
        .image-lightbox-content {
            position: relative; max-width: 90%; max-height: 90%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .image-lightbox img {
            max-width: 100%; max-height: 80vh; object-fit: contain;
            border-radius: 14px; box-shadow: 0 0 60px rgba(241, 196, 15, 0.25);
            -webkit-user-drag: none; user-select: none; pointer-events: none;
        }
        .image-lightbox-close {
            position: absolute; top: -46px; left: -6px;
            background: var(--gold); color: #000; border: none;
            width: 42px; height: 42px; border-radius: 50%;
            cursor: pointer; font-size: 1.15rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; z-index: 10;
        }
        .image-lightbox-close:hover { background: #fff; transform: rotate(90deg); }
        .image-lightbox-caption {
            color: #fff; margin-top: 16px; font-size: 1.05rem;
            font-weight: 600; text-align: center;
        }
        .image-lightbox-watermark {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            color: rgba(255, 255, 255, 0.22);
            font-size: 2rem; font-weight: 800; white-space: nowrap;
            pointer-events: none; z-index: 5; letter-spacing: 4px;
        }

        /* ===== الواجهة الرئيسية ===== */
        .main-content { display: block; padding: 24px 18px 40px; min-height: 100vh; }
        .container { max-width: 1050px; margin: 0 auto; }

        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 22px; margin-bottom: 28px;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 18px; backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }
        .brand {
            display: flex; align-items: center; gap: 12px;
            font-weight: 800; font-size: 1.05rem; letter-spacing: 1px;
        }
        .brand i {
            color: var(--gold); font-size: 1.5rem;
            filter: drop-shadow(0 0 8px rgba(241,196,15,0.7));
            animation: brandPulse 2.5s ease-in-out infinite;
        }
        @keyframes brandPulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        .brand span b { color: var(--gold); }

        .search-container {
            display: flex; align-items: center; gap: 12px;
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 18px; margin-bottom: 30px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .search-container:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-soft);
        }
        .search-container i { color: var(--gold); font-size: 1.1rem; }
        .search-container input {
            flex: 1; border: none; outline: none; background: transparent;
            color: var(--text); font-size: 1rem; font-weight: 500;
        }
        .search-container input::placeholder { color: var(--muted); }

        /* ===== مسرح الروبوت ===== */
        .robot-stage {
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px 20px 34px; margin-bottom: 26px;
            background: radial-gradient(circle at 50% 20%, rgba(241,196,15,0.10), transparent 60%), var(--panel);
            border: 1px solid var(--border); border-radius: 28px;
            backdrop-filter: blur(16px); overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 0 60px rgba(241,196,15,0.03);
        }
        .robot-stage::before {
            content: ''; position: absolute; inset: -2px; border-radius: 30px;
            background: conic-gradient(from 0deg, transparent, rgba(241,196,15,0.35), transparent 30%);
            animation: rotateBorder 8s linear infinite; z-index: -1;
            opacity: 0.5;
        }
        @keyframes rotateBorder {
            to { transform: rotate(360deg); }
        }

        /* الروبوت الكبير */
        .robot-avatar {
            width: 190px; height: 190px; border-radius: 50%;
            background: radial-gradient(circle at 35% 25%, #2a2a30, #0b0b0e 70%);
            border: 4px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 6rem; color: var(--gold);
            position: relative; cursor: pointer;
            animation: robotFloat 4s ease-in-out infinite;
            box-shadow:
                0 0 40px rgba(241,196,15,0.35),
                0 0 90px rgba(241,196,15,0.15),
                inset 0 0 40px rgba(241,196,15,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }
        .robot-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(241,196,15,0.55), 0 0 120px rgba(241,196,15,0.25);
        }
        .robot-avatar.speaking {
            animation: robotSpeak 0.6s ease-in-out infinite alternate;
            box-shadow: 0 0 70px rgba(241,196,15,0.75), 0 0 140px rgba(241,196,15,0.35);
        }
        @keyframes robotSpeak {
            from { transform: scale(1) translateY(0); }
            to { transform: scale(1.06) translateY(-6px); }
        }
        .robot-avatar::before,
        .robot-avatar::after {
            content: ''; position: absolute; border-radius: 50%;
            border: 2px solid rgba(241,196,15,0.35);
            animation: robotRing 3s ease-out infinite;
        }
        .robot-avatar::before { inset: -16px; }
        .robot-avatar::after { inset: -32px; animation-delay: 1.2s; border-color: rgba(241,196,15,0.15); }
        @keyframes robotRing {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 0; }
        }
        @keyframes robotFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }
        .robot-antenna {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 18px; background: var(--gold); border-radius: 4px;
        }
        .robot-antenna::after {
            content: ''; position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%); width: 12px; height: 12px;
            background: var(--gold); border-radius: 50%;
            box-shadow: 0 0 12px var(--gold);
            animation: antennaBlink 1.4s ease-in-out infinite;
        }
        @keyframes antennaBlink {
            0%,100% { opacity: 1; box-shadow: 0 0 14px var(--gold); }
            50% { opacity: 0.35; box-shadow: 0 0 4px var(--gold); }
        }

        .robot-bubble {
            margin-top: 26px; max-width: 640px; text-align: center;
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 22px; padding: 20px 26px;
            font-weight: 600; font-size: 1.08rem; line-height: 1.8;
            color: var(--text); position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            animation: bubbleIn 0.5s ease;
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .robot-bubble strong { color: var(--gold); }
        .robot-bubble .robot-hint {
            display: block; margin-top: 10px; font-size: 0.85rem;
            color: var(--muted); font-weight: 400;
        }
        .robot-cursor {
            display: inline-block; width: 2px; height: 1.1em;
            background: var(--gold); margin-right: 4px;
            vertical-align: text-bottom; animation: blink 0.9s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* شبكة المناطق */
        .robot-regions {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px; width: 100%; max-width: 900px; margin-top: 28px;
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .robot-region-card {
            background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px; padding: 18px 10px; text-align: center;
            cursor: pointer; transition: all 0.25s ease; position: relative;
            overflow: hidden;
        }
        .robot-region-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent, rgba(241,196,15,0.08));
            opacity: 0; transition: opacity 0.25s;
        }
        .robot-region-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 30px rgba(241,196,15,0.22);
        }
        .robot-region-card:hover::before { opacity: 1; }
        .robot-region-card .rr-icon {
            display: block; font-size: 2rem; margin-bottom: 8px;
            filter: drop-shadow(0 0 8px rgba(241,196,15,0.4));
        }
        .robot-region-card .rr-name {
            font-weight: 700; font-size: 0.88rem; color: var(--text);
            display: block; line-height: 1.3;
        }
        .robot-region-card .rr-badge {
            display: inline-block; margin-top: 8px;
            background: var(--gold-soft); color: var(--gold);
            font-size: 0.72rem; font-weight: 700; padding: 3px 12px;
            border-radius: 12px; border: 1px solid var(--border);
        }
        .robot-region-card.selected {
            background: linear-gradient(135deg, rgba(241,196,15,0.18), rgba(241,196,15,0.05));
            border-color: var(--gold);
            box-shadow: 0 0 0 2px var(--gold-soft), 0 0 30px rgba(241,196,15,0.25);
        }

        .robot-back-btn {
            background: transparent; color: var(--gold);
            border: 2px solid var(--gold); padding: 11px 24px;
            border-radius: 30px; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; margin-top: 24px; display: inline-flex;
            align-items: center; gap: 8px; transition: all 0.25s;
        }
        .robot-back-btn:hover {
            background: var(--gold); color: #000;
            box-shadow: 0 0 25px rgba(241,196,15,0.5);
        }

        /* ===== قائمة الوضعيات ===== */
        .position-list {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 24px; padding: 24px; margin-bottom: 30px;
            display: none; backdrop-filter: blur(14px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            animation: fadeUp 0.4s ease;
        }
        .position-list-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px;
        }
        .position-list-header h2 {
            color: var(--text); font-size: 1.35rem;
            display: flex; align-items: center; gap: 10px;
        }
        .position-list-header h2 i { color: var(--gold); }
        .position-list-header .count {
            background: var(--gold); padding: 5px 14px; border-radius: 20px;
            font-size: 0.82rem; color: #000; font-weight: 800;
            box-shadow: 0 0 18px rgba(241,196,15,0.4);
        }
        .position-item {
            background: var(--glass); padding: 16px 20px; border-radius: 16px;
            margin-bottom: 12px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.06);
            border-right: 3px solid var(--gold);
            display: flex; align-items: center; gap: 14px;
            transition: all 0.25s ease;
        }
        .position-item:hover {
            background: rgba(241,196,15,0.08);
            transform: translateX(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .position-item.active {
            background: linear-gradient(90deg, rgba(241,196,15,0.18), transparent);
            border-color: var(--gold);
        }
        .position-item .pos-icon { color: var(--gold); font-size: 1.2rem; width: 32px; text-align: center; }
        .position-item .pos-name { flex: 1; font-weight: 600; color: var(--text); }

        /* ===== صندوق التفاصيل ===== */
        .detail-box {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 24px; padding: 28px; display: none;
            margin-bottom: 30px; backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
            animation: fadeUp 0.4s ease;
        }
        .detail-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 22px; padding-bottom: 16px;
            border-bottom: 2px solid var(--gold);
        }
        .detail-header h3 { color: var(--text); font-size: 1.5rem; flex: 1; }
        .detail-header .badge {
            background: var(--gold); color: #000; padding: 5px 18px;
            border-radius: 20px; font-size: 0.78rem; font-weight: 800;
            box-shadow: 0 0 16px rgba(241,196,15,0.4);
        }
        .detail-images { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .detail-images figure {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px; padding: 12px; text-align: center;
            cursor: pointer; transition: border-color 0.25s;
        }
        .detail-images figure:hover { border-color: var(--border); }
        .detail-images figcaption {
            margin-top: 10px; font-weight: 600; color: var(--muted); font-size: 0.88rem;
        }
        .detail-info {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; margin: 22px 0;
        }
        .detail-info div {
            background: var(--glass); padding: 18px 14px; border-radius: 16px;
            text-align: center; border: 1px solid rgba(255,255,255,0.06);
            border-bottom: 3px solid var(--gold); transition: transform 0.25s;
        }
        .detail-info div:hover { transform: translateY(-3px); }
        .detail-info strong {
            display: block; font-size: 0.78rem; color: var(--muted);
            margin-bottom: 6px; letter-spacing: 1px;
        }
        .detail-info span {
            font-size: 1.25rem; font-weight: 800; color: var(--gold);
            text-shadow: 0 0 14px rgba(241,196,15,0.4);
        }
        .detail-purpose {
            background: rgba(241,196,15,0.06); padding: 22px;
            border-radius: 16px; border-right: 4px solid var(--gold); margin-top: 16px;
        }
        .detail-purpose h4 {
            color: var(--gold); margin-bottom: 10px; font-size: 1rem;
            display: flex; align-items: center; gap: 8px;
        }
        .detail-purpose p { color: var(--text); line-height: 1.9; font-size: 0.95rem; }

        /* ===== الاختبار ===== */
        .quiz-section {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 24px; padding: 26px; margin-top: 30px;
            backdrop-filter: blur(14px); display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .quiz-section.show { display: block; animation: fadeUp 0.4s ease; }
        .quiz-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; flex-wrap: wrap; gap: 15px;
        }
        .quiz-header h2 { color: var(--text); font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .quiz-header h2 i { color: var(--gold); }
        .quiz-region-select {
            padding: 10px 16px; border-radius: 12px;
            border: 1px solid var(--border); font-size: 0.95rem;
            font-weight: 600; background: var(--glass); color: var(--text);
            outline: none; cursor: pointer;
        }
        .quiz-region-select option { background: #111; color: #fff; }
        .quiz-score {
            background: var(--gold); color: #000; padding: 8px 20px;
            border-radius: 20px; font-weight: 800; font-size: 0.95rem;
            box-shadow: 0 0 18px rgba(241,196,15,0.4);
        }
        .quiz-question-area { text-align: center; }
        .quiz-image-container {
            display: inline-block; max-width: 100%; margin-bottom: 20px;
            border-radius: 18px; overflow: hidden; position: relative; cursor: zoom-in;
        }
        .quiz-image-container img {
            width: 100%; max-height: 350px; object-fit: contain;
            border-radius: 18px; -webkit-user-drag: none; user-select: none; pointer-events: none;
        }
        .quiz-choices {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            max-width: 620px; margin: 0 auto;
        }
        .quiz-choice-btn {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px; border-radius: 14px; font-size: 1rem;
            font-weight: 600; cursor: pointer; text-align: center;
            color: var(--text); transition: all 0.2s;
        }
        .quiz-choice-btn:hover {
            border-color: var(--gold);
            background: rgba(241,196,15,0.1);
            transform: translateY(-2px);
        }
        .quiz-choice-btn.correct {
            background: #27ae60; color: #fff; border-color: #27ae60;
            box-shadow: 0 0 20px rgba(39,174,96,0.5);
        }
        .quiz-choice-btn.wrong {
            background: #e74c3c; color: #fff; border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231,76,60,0.5);
        }
        .quiz-choice-btn:disabled { pointer-events: none; opacity: 0.85; }
        .quiz-feedback {
            margin-top: 18px; font-weight: 700; font-size: 1.05rem; min-height: 30px;
        }
        .quiz-next-btn {
            background: var(--gold); color: #000; border: none;
            padding: 13px 34px; border-radius: 30px; font-size: 1rem;
            font-weight: 800; cursor: pointer; margin-top: 16px;
            transition: all 0.25s; box-shadow: 0 0 20px rgba(241,196,15,0.3);
        }
        .quiz-next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(241,196,15,0.6);
        }

        /* ===== الفوتر ===== */
        .footer {
            text-align: center; margin-top: 44px; padding: 34px 24px;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 24px; color: var(--text);
            backdrop-filter: blur(14px);
        }
        .footer .credit {
            font-size: 1rem; font-weight: 600; margin-bottom: 10px;
            color: var(--muted); line-height: 1.9;
        }
        .footer .credit strong { color: var(--gold); }
        .footer .social-links {
            display: flex; justify-content: center; gap: 16px; margin: 18px 0; flex-wrap: wrap;
        }
        .footer .social-links a {
            color: #000; text-decoration: none; background: var(--gold);
            padding: 10px 22px; border-radius: 30px; display: flex;
            align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem;
            transition: all 0.25s; box-shadow: 0 0 18px rgba(241,196,15,0.3);
        }
        .footer .social-links a:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 28px rgba(241,196,15,0.6);
        }
        .footer .coop {
            margin-top: 18px; padding-top: 18px;

    function getR2Url(imagePath) {
        if (!imagePath) return '';

            const folderIndex = imagePath.indexOf('upload/');
            if (folderIndex !== -1) {
                const afterUpload = imagePath.substring(folderIndex + 7);
                const pathParts = afterUpload.split('/');
                if (pathParts.length > 1) {
                    pathParts.pop();
                    const folder = pathParts.join('/');
                    return `${R2_WORKER_URL}/${folder}/${filename}`;
                }
            }
            return `${R2_WORKER_URL}/${filename}`;
        }
        if (imagePath.includes('frosty-field-ea93')) return imagePath;
        return `${R2_WORKER_URL}/${imagePath}`;
    }

    const regions = [

    let allData = {};

    // ===== النطق الصوتي (Text-to-Speech) =====
    let arabicVoice = null;

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        arabicVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar')) || null;
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakArabic(text) {
        if (!('speechSynthesis' in window)) return;
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;
            utterance.volume = 1;
            if (arabicVoice) utterance.voice = arabicVoice;

            const avatar = document.getElementById('robotAvatar');
            utterance.onstart = () => { if (avatar) avatar.classList.add('speaking'); };
            utterance.onend = () => { if (avatar) avatar.classList.remove('speaking'); };
            utterance.onerror = () => { if (avatar) avatar.classList.remove('speaking'); };

            window.speechSynthesis.speak(utterance);
        } catch (e) {
            console.warn('Speech synthesis error:', e);
        }
    }

    // ===== كتابة نص الروبوت بشكل مطبعي =====
    function typeRobotMessage(html, hint) {
        const msgEl = document.getElementById('robotMessage');
        const hintEl = document.getElementById('robotHint');
        if (!msgEl) return;

        if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        const fullText = tempDiv.textContent || '';

        msgEl.innerHTML = '<span class="robot-cursor"></span>';
        if (hintEl) hintEl.innerHTML = '';

        let i = 0;
        typingTimer = setInterval(() => {
            i++;
            const partial = fullText.substring(0, i);
            msgEl.innerHTML = partial + '<span class="robot-cursor"></span>';
            if (i >= fullText.length) {
                clearInterval(typingTimer);
                typingTimer = null;
                msgEl.innerHTML = html;
                if (hintEl && hint !== undefined) hintEl.innerHTML = hint;
            }
        }, 22);
    }

    function getRegionCount(regionName) {
        return (allData[regionName] || []).length;
    }

    function renderRobotRegions() {
        const container = document.getElementById('robotRegions');
        if (!container) return;
        container.innerHTML = '';

        regions.forEach(region => {
            const count = getRegionCount(region.name);
            const card = document.createElement('div');
            card.className = 'robot-region-card' + (selectedRegion === region.name ? ' selected' : '');
            card.dataset.region = region.name;
            card.innerHTML = `
                <span class="rr-icon">${region.icon}</span>
                <span class="rr-name">${region.name}</span>
                <span class="rr-badge">${count} وضعية</span>
            `;
            card.onclick = () => selectRegionFromRobot(region.name, card);
            container.appendChild(card);
        });
    }

    // فتح الروبوت: الضغط على الأفاتار يعرض السؤال ثم المناطق
    function openRobot() {
        robotOpened = true;
        const regionsEl = document.getElementById('robotRegions');
        const backContainer = document.getElementById('robotBackContainer');

        // إخفاء الوضعيات والتفاصيل عند فتح الروبوت
        document.getElementById('positionList').style.display = 'none';
        document.getElementById('detailBox').style.display = 'none';
        selectedRegion = null;
        if (backContainer) backContainer.innerHTML = '';

        renderRobotRegions();
        regionsEl.style.display = 'grid';
        regionsEl.style.animation = 'none';
        void regionsEl.offsetWidth;
        regionsEl.style.animation = 'fadeUp 0.5s ease';

        const welcomeHtml = 'أهلاً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>ما المنطقة التي تريد أن تشاهد وضعيات التصوير الشعاعي الخاصة بها؟';
        typeRobotMessage(welcomeHtml, '💡 اختر إحدى المناطق بالأسفل');

        // النطق الصوتي عند الضغط على الروبوت
        speakArabic('أَهْلًا بِكَ! أَنَا مُسَاعِدُكَ الشُّعَاعِيُّ. مَا الْمِنْطَقَةُ الَّتِي تُرِيدُ أَنْ تُشَاهِدَ وَضْعِيَّاتِ التَّصْوِيرِ الشُّعَاعِيِّ الْخَاصَّةَ بِهَا؟');
    }

    function selectRegionFromRobot(regionName, cardElement) {
        document.querySelectorAll('.robot-region-card').forEach(c => c.classList.remove('selected'));
        if (cardElement) cardElement.classList.add('selected');

        const count = getRegionCount(regionName);
        typeRobotMessage(
            `ممتاز! اخترت <strong>${regionName}</strong> 🎯<br>عدد الوضعيات المتاحة: <strong>${count}</strong>`,
            '💡 اضغط على أي وضعية بالأسفل لعرض تفاصيلها'
        );

        const backContainer = document.getElementById('robotBackContainer');
        if (backContainer) {
            backContainer.innerHTML = '';
            const backBtn = document.createElement('button');
            backBtn.className = 'robot-back-btn';
            backBtn.innerHTML = '<i class="fas fa-arrow-right"></i> تغيير المنطقة';
            backBtn.onclick = () => resetRobotSelection();
            backContainer.appendChild(backBtn);
        }

        selectedRegion = regionName;
        document.getElementById('detailBox').style.display = 'none';

        const positionList = document.getElementById('positionList');
        positionList.style.display = 'block';
        document.getElementById('regionTitle').textContent = `وضعيات ${regionName}`;
        const positions = allData[regionName] || [];
        document.getElementById('positionCount').textContent = positions.length;

        const positionsContainer = document.getElementById('positionsContainer');
        positionsContainer.innerHTML = '';
        if (positions.length === 0) {
            positionsContainer.innerHTML = '<p class="no-data">لا توجد وضعيات متاحة لهذه المنطقة حالياً.</p>';
        } else {
            positions.forEach((pos, index) => {
                const div = document.createElement('div');
                div.className = 'position-item';
                div.innerHTML = `
                    <span class="pos-icon"><i class="fas fa-x-ray"></i></span>
                    <span class="pos-name">${pos.name || 'وضعية ' + (index + 1)}</span>
                `;
                div.onclick = () => {
                    document.querySelectorAll('.position-item').forEach(p => p.classList.remove('active'));
                    div.classList.add('active');
                    showDetail(pos);
                };
                positionsContainer.appendChild(div);
            });
        }

        positionList.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetRobotSelection() {
        selectedRegion = null;
        document.querySelectorAll('.robot-region-card').forEach(c => c.classList.remove('selected'));
        const backContainer = document.getElementById('robotBackContainer');
        if (backContainer) backContainer.innerHTML = '';
        document.getElementById('positionList').style.display = 'none';
        document.getElementById('detailBox').style.display = 'none';
        renderRobotRegions();
        typeRobotMessage(
            'ما المنطقة التي تريد أن تشاهد وضعيات التصوير الشعاعي الخاصة بها؟',

        );
    }

    window.selectRegionFromRobot = selectRegionFromRobot;
    window.resetRobotSelection = resetRobotSelection;

    function showDetail(pos) {
        document.getElementById('detailBox').style.display = 'block';
        document.getElementById('detailTitle').textContent = pos.name || '';
        document.getElementById('detailBadge').textContent = pos.region || '';

        const realImgUrl = getR2Url(pos.realImg);
        const xrayImgUrl = getR2Url(pos.xrayImg);
        const fallback = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23181818%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2216%22%3Eلا توجد صورة%3C/text%3E%3C/svg%3E';

        document.getElementById('detailImages').innerHTML = `

    function updateQuizRegionSelect() {
        const select = document.getElementById('quizRegionSelect');
        if (!select) return;
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- اختر المنطقة --</option>';
        Object.keys(allData).filter(reg => allData[reg] && allData[reg].length > 0).forEach(reg => {
            const option = document.createElement('option');
            option.value = reg;
            option.textContent = reg;
            select.appendChild(option);
        });
        if (currentVal && allData[currentVal]) select.value = currentVal;
    }

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startQuiz(region) {
        const positions = allData[region] || [];
        if (positions.length < 1) return;

        const allPositionNames = [];
        Object.keys(allData).forEach(reg => {
            allData[reg].forEach(pos => { if (pos.name) allPositionNames.push(pos.name); });
        });

        const allQuestions = [];
        positions.forEach(pos => {
            if (pos.realImg) {
                const wrongChoices = shuffleArray(allPositionNames.filter(name => name !== pos.name)).slice(0, 3);
                allQuestions.push({
                    imageSrc: getR2Url(pos.realImg),
                    correctAnswer: pos.name,
                    choices: shuffleArray([pos.name, ...wrongChoices]),
                    questionId: pos.id + '_real'
                });
            }
            if (pos.xrayImg) {
                const wrongChoices = shuffleArray(allPositionNames.filter(name => name !== pos.name)).slice(0, 3);
                allQuestions.push({
                    imageSrc: getR2Url(pos.xrayImg),
                    correctAnswer: pos.name,
                    choices: shuffleArray([pos.name, ...wrongChoices]),
                    questionId: pos.id + '_xray'
                });
            }
        });

        quizQuestions = shuffleArray(allQuestions);
        currentQuestionIndex = 0;
        correctCount = 0;
        answered = false;
        document.getElementById('quizScore').textContent = `0 / ${quizQuestions.length}`;
        renderQuestion();
    }

    function renderQuestion() {
        const content = document.getElementById('quizContent');
        if (!content) return;

        if (currentQuestionIndex >= quizQuestions.length) {
            content.innerHTML = `
                <div style="text-align:center; padding: 30px;">
                    <i class="fas fa-trophy" style="font-size: 4rem; color: var(--gold);"></i>
                    <h3 style="margin:14px 0; color:#fff;">انتهى الاختبار!</h3>
                    <p style="color: var(--muted);">نتيجتك: ${correctCount} من ${quizQuestions.length}</p>
                    <button class="quiz-next-btn" onclick="restartQuiz()">إعادة</button>
                </div>`;
            return;
        }

        const q = quizQuestions[currentQuestionIndex];
        answered = false;

        let html = `
            <div class="quiz-question-area">
                <p style="color: var(--muted); margin-bottom:14px;">السؤال ${currentQuestionIndex + 1} من ${quizQuestions.length}</p>
                <div class="quiz-image-container">
                    <div class="watermark-container" onclick="openImageLightbox('${q.imageSrc}', 'سؤال ${currentQuestionIndex + 1}')">
                        <img src="${q.imageSrc}" alt="وضعية" class="protected-image">
                    </div>
                    <p style="margin-top: 6px; font-size: 0.85rem; color: var(--muted);">اضغط على الصورة للتكبير</p>
                </div>
                <div class="quiz-choices">`;

        q.choices.forEach(choice => {
            html += `<button class="quiz-choice-btn" data-choice="${choice}">${choice}</button>`;
        });

        html += `</div><div class="quiz-feedback" id="quizFeedback"></div></div>`;
        content.innerHTML = html;

        document.querySelectorAll('.quiz-choice-btn').forEach(btn => {
            btn.onclick = function() {
                if (answered) return;
                answered = true;
                const selected = this.dataset.choice;
                const correct = q.correctAnswer;

                document.querySelectorAll('.quiz-choice-btn').forEach(b => b.disabled = true);

                const questionId = q.questionId;
                const isAlreadyAnswered = userQuizProgress[questionId] !== undefined;

                let pointsDelta = 0;
                let message = '';

                if (selected === correct) {
                    this.classList.add('correct');
                    correctCount++;
                    if (!isAlreadyAnswered) {
                        pointsDelta = 1;
                        message = '<span style="color:#27ae60;">✅ صحيح! +1 نقطة</span>';
                    } else {
                        message = '<span style="color:#27ae60;">✅ صحيح! (تم احتساب النقاط مسبقًا)</span>';
                    }
                } else {
                    this.classList.add('wrong');
                    document.querySelectorAll('.quiz-choice-btn').forEach(b => {
                        if (b.dataset.choice === correct) b.classList.add('correct');
                    });
                    if (!isAlreadyAnswered) {
                        pointsDelta = -1;
                        message = `<span style="color:#e74c3c;">❌ خطأ. الصحيح: ${correct} -1 نقطة</span>`;
                    } else {
                        message = `<span style="color:#e74c3c;">❌ خطأ. الصحيح: ${correct} (تم احتساب النقاط مسبقًا)</span>`;
                    }
                }

                document.getElementById('quizFeedback').innerHTML = message;

                if (currentUser && !isAlreadyAnswered) {
                    const userRef = ref(db, 'users/' + currentUser.uid);
                    get(userRef).then((snapshot) => {
                        const currentPoints = snapshot.exists() ? (snapshot.val().points || 0) : 0;
                        const newPoints = currentPoints + pointsDelta;
                        update(userRef, {
                            points: newPoints,
                            [`quizProgress/${questionId}`]: pointsDelta
                        }).then(() => {
                            userQuizProgress[questionId] = pointsDelta;
                        }).catch(error => console.error('Error updating points:', error));

                        update(ref(db, 'leaderboard/' + currentUser.uid), { points: newPoints })
                            .catch(error => console.error('Error updating leaderboard:', error));
                    }).catch(error => console.error('Error fetching user data:', error));
                }

                document.getElementById('quizScore').textContent = `${correctCount} / ${quizQuestions.length}`;

                const nextBtn = document.createElement('button');
                nextBtn.className = 'quiz-next-btn';
                nextBtn.innerHTML = 'التالي <i class="fas fa-arrow-left"></i>';
                nextBtn.onclick = () => { currentQuestionIndex++; renderQuestion(); };
                document.getElementById('quizFeedback').appendChild(document.createElement('br'));
                document.getElementById('quizFeedback').appendChild(nextBtn);
            };
        });
    }

    window.restartQuiz = function() {
        const region = document.getElementById('quizRegionSelect').value;
        if (region) startQuiz(region);
    };

    document.getElementById('searchInput').oninput = function(e) {
        const query = e.target.value.toLowerCase().trim();
        const regionsEl = document.getElementById('robotRegions');
        // البحث يفتح شبكة المناطق إن لم تكن مفتوحة
        if (query && regionsEl.style.display === 'none') {
            openRobot();
        }
        document.querySelectorAll('.robot-region-card').forEach(card => {
            const name = (card.dataset.region || '').toLowerCase();
            card.style.display = name.includes(query) ? 'block' : 'none';
        });
    };

    document.getElementById('startQuizBtn').onclick = function() {
        const section = document.getElementById('quizSection');
        section.classList.toggle('show');
        if (section.classList.contains('show')) {
            updateQuizRegionSelect();
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    };

    document.getElementById('quizRegionSelect').onchange = function() {
        if (this.value) startQuiz(this.value);
    };

    // الضغط على الروبوت يفتح السؤال + ينطق العبارة الترحيبية
    document.getElementById('robotAvatar').addEventListener('click', function() {
        openRobot();
    });

    // مراقبة حالة المستخدم - بدون شاشة تسجيل دخول وبدون عرض بريد أو نقاط
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
            onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    userQuizProgress = data.quizProgress || {};
                }
            });
        } else {
            userQuizProgress = {};
        }
    });

    // تحميل البيانات
    onValue(ref(db, 'positions'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
            allData = {};
            Object.keys(data).forEach(key => {
                const item = data[key];
                const region = item.region || 'OTHER';
                if (!allData[region]) allData[region] = [];
                allData[region].push({ id: key, ...item });
            });
        }
        // تحديث عدّادات المناطق في الروبوت
        renderRobotRegions();
        updateQuizRegionSelect();
        // رسالة ترحيب أولية في فقاعة الروبوت
        if (!robotOpened) {
            typeRobotMessage(
                'مرحباً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>اضغط عليّ لبدء اختيار المنطقة.',
                '💡 أو استخدم مربع البحث بالأعلى'
            );
        }
    }, (error) => {
        console.error('Error loading positions:', error);
        renderRobotRegions();
        if (!robotOpened) {
            typeRobotMessage(
                'مرحباً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>اضغط عليّ لبدء اختيار المنطقة.',
                '💡 أو استخدم مربع البحث بالأعلى'
            );
        }
    });

    // التهيئة الأولية
    renderRobotRegions();
    typeRobotMessage(
        'مرحباً بك! <strong>أنا مساعدك الشعاعي</strong> 🤖<br>اضغط عليّ لبدء اختيار المنطقة.',
        '💡 أو استخدم مربع البحث بالأعلى'
    );
    document.body.style.overflow = 'auto';
</script>

</body>
</html>
